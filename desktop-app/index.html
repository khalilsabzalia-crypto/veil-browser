<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; frame-src https:; child-src https:;">
<title>Veil Browser</title>
<style>
:root{color-scheme:light;--bg:#f5f0e9;--side:#f8f4ef;--ink:#39291d;--muted:#806f60;--line:#e4d8cb;--accent:#b66f37;--white:#fffdfb}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
#tabs{height:42px;display:flex;align-items:end;gap:5px;padding:5px 10px 0;background:#e9dfd4;border-bottom:1px solid #d8c8b8;overflow-x:auto;flex:none}.tab{height:36px;min-width:125px;max-width:230px;padding:0 10px;display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:9px 9px 0 0;color:#7b6756;cursor:pointer;white-space:nowrap;overflow:hidden}.tab.active{background:var(--side);border-color:#d8c8b8;border-bottom-color:var(--side);color:var(--ink)}.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}.close{border:0;background:transparent;color:#927b67;font-size:17px}#newtab{height:31px;width:34px;border:0;background:transparent;color:#7b6756;font-size:22px}
#toolbar{height:49px;display:flex;gap:7px;align-items:center;padding:6px 12px;background:var(--side);border-bottom:1px solid var(--line);flex:none}.nav{height:32px;min-width:32px;border:0;border-radius:8px;background:transparent;color:#806f60;font-size:17px}.nav:hover{background:#eee3d7}#addressWrap{flex:1;display:flex;align-items:center;background:var(--white);border:1px solid #dfd0c0;border-radius:11px;padding:0 12px;height:34px;gap:9px}#address{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}#goBtn{height:32px;border:1px solid var(--accent);border-radius:9px;background:var(--white);color:var(--ink);font-weight:700;padding:0 14px}#status{height:21px;padding:3px 13px;color:#8a7766;font-size:10px;background:var(--side);flex:none}
#layout{display:flex;min-height:0;flex:1}#sidebar{width:220px;flex:none;background:#f7f1eb;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 9px;gap:3px}#sidebrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;padding:5px 8px 14px}.brandmark{width:19px;height:10px;border:3px solid #fff;border-radius:100%;background:#b9804c;outline:1px solid #b9804c}.sidebtn{border:0;background:transparent;color:#5c4939;text-align:left;border-radius:8px;padding:10px 11px;display:flex;gap:10px;align-items:center}.sidebtn:hover,.sidebtn.active{background:#e9ddd0}.sideheading{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#a08a77;padding:14px 10px 5px}.tablist{display:flex;flex-direction:column;gap:3px;overflow:auto}.sideTab{display:flex;align-items:center;gap:8px;min-width:0;border:0;border-radius:8px;background:transparent;text-align:left;padding:9px 10px;color:#6b5644}.sideTab.active{background:#e8dbce;border:1px solid #dfd0c1}.sideTab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.sideTab .close{font-size:14px}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
#views{position:relative;flex:1;min-width:0;min-height:0;background:var(--bg)}webview{position:absolute;inset:0;width:100%;height:100%;display:none;background:#fff}webview.active{display:flex}
#welcome{position:absolute;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 42%,#f3e2c9 0%,#e5c69f 48%,#d9b58c 100%)}.page{max-width:920px;margin:0 auto;min-height:100%;padding:24px 30px 30px;display:flex;flex-direction:column;align-items:center}.discord{align-self:flex-end;border:1px solid #e8d6c3;border-radius:14px;background:#fffaf5;padding:12px 16px;color:#5a4432;font-weight:700;box-shadow:0 4px 20px #7b57301c}.hero{width:100%;margin:auto 0;text-align:center;padding:28px 0 55px}.brand{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:40px;font-size:clamp(52px,7vw,86px);font-weight:550;letter-spacing:-5px;color:#38271a}.brand .brandmark{width:58px;height:29px;border:8px solid white;background:transparent;outline:0;border-radius:100%}
#homeSearch{display:flex;gap:10px;align-items:center;width:min(100%,660px);margin:0 auto;background:var(--white);border:1px solid #ead9c6;border-radius:40px;padding:8px 14px 8px 20px;box-shadow:0 7px 25px #69411c1a;height:55px}#homeInput{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}#searchBtn{border:0;background:transparent;color:#5c4633;font-size:20px;padding:4px 8px}
.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;gap:18px 22px;max-width:660px;margin:34px auto 0}.shortcut{width:76px;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:#4b3829;font-size:12px}.shortcut .bubble{width:45px;height:45px;display:grid;place-items:center;background:#fffdfb;border-radius:50%;box-shadow:0 5px 13px #76502c22;font-size:21px;transition:transform .15s}.shortcut:hover .bubble{transform:translateY(-3px)}.bottomline{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;color:#6d513b;font-size:11px}.online{background:#fffaf5;border:1px solid #ead7c4;border-radius:20px;padding:9px 14px}.customize{border:1px solid #e6d1bc;border-radius:12px;background:#fffaf5;padding:11px 15px;color:#5c4431;font-weight:650}
@media(max-width:760px){#sidebar{width:58px;padding:10px 5px}#sidebrand{justify-content:center;padding:8px 0 18px;font-size:0}.sidebtn{justify-content:center;font-size:0;padding:12px 5px}.sidebtn span{display:none}.sideheading,.tablist,.sidebottom .sidebtn{display:none}.page{padding:18px 12px}.brand{margin-bottom:30px}.hero{padding-bottom:30px}.shortcuts{gap:15px 8px}.shortcut{width:65px}.bottomline{font-size:10px}}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="toolbar">
<button class="nav" id="back" title="Back" disabled>‹</button><button class="nav" id="forward" title="Forward" disabled>›</button><button class="nav" id="reload" title="Reload">↻</button><button class="nav" id="home" title="New tab">⌂</button>
<div id="addressWrap"><span>◎</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search DuckDuckGo or enter a website address"></div><button id="goBtn">Go ↗</button>
</div>
<div id="status">VEIL BROWSER · DuckDuckGo search</div>
<div id="layout"><aside id="sidebar">
<div id="sidebrand"><span class="brandmark"></span> Veil</div>
<button class="sidebtn active" id="sideNew">＋ <span>New tab</span></button>
<div class="sideheading">Open tabs</div><div class="tablist" id="sideTabs"></div>
<div class="sidebottom"><button class="sidebtn" id="sideSearch">⌕ <span>Search DuckDuckGo</span></button><button class="sidebtn" id="sideGames">♟ <span>Games</span></button></div>
</aside>
<div id="views"><div id="welcome"><main class="page">
<button class="discord" id="community">✦ &nbsp; Veil Browser</button>
<section class="hero"><div class="brand"><span class="brandmark"></span><span>Veil</span></div>
<form id="homeSearch"><span style="font-size:19px">⌕</span><input id="homeInput" placeholder="Search DuckDuckGo" autocomplete="off"><button id="searchBtn" type="submit" aria-label="Search">↗</button></form>
<div class="shortcuts">
<button class="shortcut" data-url="https://www.crazygames.com/"><span class="bubble">🎮</span><span>Games</span></button>
<button class="shortcut" data-url="https://duckduckgo.com/"><span class="bubble">✧</span><span>Search</span></button>
<button class="shortcut" data-url="https://www.youtube.com/"><span class="bubble">▶</span><span>YouTube</span></button>
<button class="shortcut" data-url="https://www.instagram.com/"><span class="bubble">◎</span><span>Instagram</span></button>
<button class="shortcut" data-url="https://www.tiktok.com/"><span class="bubble">♪</span><span>TikTok</span></button>
<button class="shortcut" data-url="https://discord.com/"><span class="bubble">☻</span><span>Discord</span></button>
<button class="shortcut" data-url="https://open.spotify.com/"><span class="bubble">♫</span><span>Spotify</span></button>
<button class="shortcut" data-url="https://www.twitch.tv/"><span class="bubble">▣</span><span>Twitch</span></button>
<button class="shortcut" data-url="https://www.roblox.com/"><span class="bubble">◇</span><span>Roblox</span></button>
<button class="shortcut" id="addShortcut"><span class="bubble">＋</span><span>Add shortcut</span></button>
</div></section>
<div class="bottomline"><span class="online">● &nbsp; Ready to browse</span><button class="customize" id="customize">Customize</button></div>
</main></div></div></div>
<script>
const tabsEl=document.getElementById('tabs'),sideTabs=document.getElementById('sideTabs'),views=document.getElementById('views'),address=document.getElementById('address'),statusEl=document.getElementById('status'),welcome=document.getElementById('welcome');
let tabs=[],activeId=null,nextId=1;
function normalize(input){const v=String(input||'').trim();if(!v)return 'https://duckduckgo.com/';if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)&&!v.includes(' '))return 'https://'+v;return 'https://duckduckgo.com/?q='+encodeURIComponent(v)}
function active(){return tabs.find(t=>t.id===activeId)}
function renderTabs(){tabsEl.replaceChildren();sideTabs.replaceChildren();tabs.forEach(t=>{const el=document.createElement('div');el.className='tab'+(t.id===activeId?' active':'');const title=document.createElement('span');title.textContent=t.title;const close=document.createElement('button');close.className='close';close.textContent='×';close.title='Close tab';el.append(title,close);el.addEventListener('click',()=>switchTab(t.id));close.addEventListener('click',e=>{e.stopPropagation();closeTab(t.id)});tabsEl.append(el);
const s=document.createElement('button');s.className='sideTab'+(t.id===activeId?' active':'');const dot=document.createElement('span');dot.textContent='◎';const st=document.createElement('span');st.textContent=t.title;const sc=document.createElement('button');sc.className='close';sc.textContent='×';s.append(dot,st,sc);s.onclick=()=>switchTab(t.id);sc.onclick=e=>{e.stopPropagation();closeTab(t.id)};sideTabs.append(s)});const plus=document.createElement('button');plus.id='newtab';plus.textContent='+';plus.title='New tab';plus.onclick=()=>makeTab();tabsEl.append(plus)}
function switchTab(id){activeId=id;const t=active();tabs.forEach(x=>x.view.classList.toggle('active',x.id===id));welcome.style.display=t&&t.url?'none':'block';address.value=t?.url||'';renderTabs();syncNav();statusEl.textContent=t?.url||'VEIL BROWSER · DuckDuckGo search'}
function makeTab(url=''){const id=nextId++;const view=document.createElement('webview');view.setAttribute('partition','persist:veil');view.setAttribute('allowpopups','false');view.setAttribute('webpreferences','contextIsolation=yes,nodeIntegration=no,sandbox=yes');view.addEventListener('did-start-loading',()=>{if(activeId===id)statusEl.textContent='Loading website…'});view.addEventListener('did-stop-loading',()=>{if(activeId===id){statusEl.textContent=view.getURL()||'Ready';syncNav()}});view.addEventListener('page-title-updated',e=>{const t=tabs.find(x=>x.id===id);if(t){t.title=e.title||'Website';renderTabs()}});view.addEventListener('did-navigate',()=>{if(activeId===id){address.value=view.getURL();syncNav()}});view.addEventListener('did-navigate-in-page',()=>{if(activeId===id)address.value=view.getURL()});view.addEventListener('did-fail-load',e=>{if(activeId===id&&e.errorCode!==-3)statusEl.textContent='Could not load this page. The site or network may block it.'});views.append(view);const t={id,view,title:'New tab',url};tabs.push(t);switchTab(id);if(url)navigate(url);return t}
function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;tabs[i].view.remove();tabs.splice(i,1);if(!tabs.length){makeTab();return}if(activeId===id)switchTab(tabs[Math.max(0,i-1)].id);else renderTabs()}
function navigate(raw){const t=active();if(!t)return;const url=normalize(raw);t.url=url;t.title='Loading…';welcome.style.display='none';t.view.loadURL(url);address.value=url;renderTabs()}
function syncNav(){const v=active()?.view;document.getElementById('back').disabled=!v||!v.canGoBack();document.getElementById('forward').disabled=!v||!v.canGoForward()}
document.getElementById('goBtn').onclick=()=>navigate(address.value);address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate(address.value)});
document.getElementById('back').onclick=()=>{const v=active()?.view;if(v?.canGoBack())v.goBack()};document.getElementById('forward').onclick=()=>{const v=active()?.view;if(v?.canGoForward())v.goForward()};document.getElementById('reload').onclick=()=>{const v=active()?.view;if(v?.getURL())v.reload()};
document.getElementById('home').onclick=()=>makeTab();document.getElementById('sideNew').onclick=()=>makeTab();document.getElementById('sideSearch').onclick=()=>{switchTab(activeId);address.focus()};document.getElementById('sideGames').onclick=()=>navigate('https://www.crazygames.com/');
document.getElementById('homeSearch').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('homeInput').value.trim();if(q)navigate('https://duckduckgo.com/?q='+encodeURIComponent(q))});
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.url)));
document.getElementById('addShortcut').onclick=()=>{const u=prompt('Enter a website address to open:');if(u)navigate(u)};
document.getElementById('customize').onclick=()=>{const color=prompt('Choose a new-tab background color (example: #ead0ad):');if(color&&/^#[0-9a-f]{6}$/i.test(color))welcome.style.background=color};
document.getElementById('community').onclick=()=>{statusEl.textContent='Veil Browser · DuckDuckGo is the default search engine.'};
makeTab();
</script>
</body></html>
