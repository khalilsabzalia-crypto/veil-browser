<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline'; img-src 'self' https: data:; frame-src https:; child-src https:;">
<title>Veil Browser</title>
<style>
:root{color-scheme:light;--ink:#38291d;--muted:#806f60;--line:#e7d9cc;--panel:#fbf7f2;--cream:#f5eee6;--accent:#c77d42}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}button,input{font:inherit}button{cursor:pointer;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
#toolbar{height:49px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#fbf7f2;border-bottom:1px solid var(--line);flex:none}
.logo-mini{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:750;width:91px;flex:none}.mark{display:inline-block;width:18px;height:10px;border:3px solid #fff;border-radius:50%;background:#e4c29e;box-shadow:0 0 0 1px #e4c29e}.tool{height:31px;width:31px;border:0;border-radius:8px;background:transparent;color:#887765;font-size:18px;display:grid;place-items:center}.tool:hover{background:#eee3d8}.tool:disabled{opacity:.35;cursor:default}
#addressWrap{height:34px;display:flex;align-items:center;gap:9px;flex:1;min-width:80px;background:#fffdfa;border:1px solid #e2d3c5;border-radius:11px;padding:0 12px;margin-left:4px}#address{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#483629;font-size:13px}#address::placeholder{color:#8b7968}#go{height:34px;padding:0 15px;border:1px solid #c87b40;border-radius:10px;background:#fffdfa;font-weight:700}#go:hover{background:#fff3e7}
#body{display:flex;flex:1;min-height:0}
#sidebar{width:221px;flex:none;background:#f8f3ed;border-right:1px solid #e8dbcf;display:flex;flex-direction:column;padding:10px 7px 8px;gap:3px}
#newTab{display:flex;align-items:center;gap:12px;height:39px;border:0;border-radius:9px;background:transparent;text-align:left;padding:0 12px;color:#49382a;margin-bottom:8px}#newTab:hover{background:#eee2d6}
#tabList{border-top:1px solid #e5d8cc;padding-top:9px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.tab{height:43px;min-height:43px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;color:#675340;min-width:0}.tab:hover{background:#f0e7de}.tab.active{background:#e9ddd1;border-color:#dfd0c2;box-shadow:0 2px 4px #6c4d3014}.tabIcon{width:19px;flex:none;color:#927a63;font-size:16px}.tabTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tabClose{border:0;background:transparent;color:#9a8571;font-size:16px;padding:0 1px}.tabClose:hover{color:#49382a}
#sideBottom{margin-top:auto;border-top:1px solid #e5d8cc;padding-top:10px;display:flex;flex-direction:column;gap:3px}.sideAction{height:38px;border:0;border-radius:9px;background:transparent;display:flex;align-items:center;gap:12px;padding:0 11px;text-align:left;color:#4c3929}.sideAction:hover,.sideAction.active{background:#eee2d6}.sideIcon{width:17px;font-size:17px;text-align:center}
#content{position:relative;flex:1;min-width:0;min-height:0;background:#fff}#start{position:absolute;inset:0;overflow:auto;background:radial-gradient(ellipse at 49% 42%,#f5e2c7 0%,#e6c69f 48%,#d8b58f 100%)}#start:before{content:"";position:absolute;inset:-30px;background:radial-gradient(ellipse at 25% 25%,#fff4df99,transparent 38%),radial-gradient(ellipse at 75% 70%,#c99d6d55,transparent 35%);filter:blur(18px);pointer-events:none}
#startInner{position:relative;min-height:100%;max-width:1100px;margin:auto;padding:26px 24px 24px;display:flex;flex-direction:column;align-items:center}
#discord{align-self:flex-end;border:1px solid #e9d8c6;background:#fffaf5;border-radius:17px;padding:12px 16px;box-shadow:0 5px 20px #65401d13;font-weight:700;color:#4a3727}
#hero{width:100%;margin:auto 0;text-align:center;padding:35px 0 54px}
#wordmark{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:43px;font-size:clamp(57px,7.2vw,90px);font-weight:550;letter-spacing:-5px;line-height:1;color:#382719}
#wordmark .mark{width:61px;height:30px;border:9px solid white;background:transparent;box-shadow:none}
#searchForm{height:56px;width:min(100%,660px);margin:0 auto;display:flex;align-items:center;gap:13px;background:#fffdfb;border:1px solid #f1e3d4;border-radius:40px;padding:0 18px;box-shadow:0 7px 23px #6e4c2a16}
#searchInput{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#4c3929;font-size:14px}#searchInput::placeholder{color:#7e6b59}#searchSubmit{border:0;background:transparent;font-size:22px;padding:3px;color:#493526}
#shortcuts{display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:27px 21px;max-width:690px;margin:39px auto 0}
.shortcut{width:88px;display:flex;flex-direction:column;align-items:center;gap:9px;border:0;background:transparent;color:#4b3829;padding:0;font-size:12px}.bubble{width:45px;height:45px;display:grid;place-items:center;border-radius:50%;background:#fffdfa;box-shadow:0 5px 15px #5e3b1c1b;font-size:21px;transition:transform .15s}.shortcut:hover .bubble{transform:translateY(-3px)}.shortcut:focus-visible{outline:2px solid #bc7740;outline-offset:4px;border-radius:8px}
#foot{width:100%;margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:#63482f}#online{background:#fffaf5;border:1px solid #ead9c7;border-radius:24px;padding:10px 15px;font-size:12px}#online:before{content:"●";font-size:10px;color:#c9834c;margin-right:8px}#customize{background:#fffaf5;border:1px solid #ead9c7;border-radius:13px;padding:12px 16px;font-weight:650}
webview{position:absolute;inset:0;width:100%;height:100%;display:none;background:#fff}webview.active{display:flex}
#pageStatus{position:absolute;left:0;right:0;bottom:0;height:22px;background:#fbf7f2;border-top:1px solid #e9ddd1;color:#8b7764;padding:4px 12px;font-size:10px;display:none;z-index:2}#pageStatus.show{display:block}
@media(max-width:720px){#sidebar{width:58px;padding:9px 4px}#newTab{justify-content:center;padding:0;font-size:0}#newTab .sideIcon{font-size:19px}#tabList{border-top:1px solid #e5d8cc}.tab{justify-content:center;padding:0 3px}.tabTitle,.tabClose{display:none}.tabIcon{width:auto}#sideBottom .sideAction{justify-content:center;padding:0;font-size:0}#sideBottom .sideIcon{font-size:18px}#toolbar{gap:3px;padding:0 5px}.logo-mini{width:26px;font-size:0;gap:0}.logo-mini .mark{width:17px}#wordmark{gap:15px;font-size:57px;margin-bottom:32px}#wordmark .mark{width:43px;height:23px;border-width:7px}#startInner{padding:16px 12px}#shortcuts{gap:20px 7px;margin-top:28px}.shortcut{width:65px}#foot{font-size:10px}}
</style>
</head>
<body>
<div id="app">
<header id="toolbar">
<div class="logo-mini"><span class="mark"></span>Veil</div>
<button class="tool" id="back" title="Back" aria-label="Back" disabled>‹</button>
<button class="tool" id="forward" title="Forward" aria-label="Forward" disabled>›</button>
<button class="tool" id="reload" title="Reload" aria-label="Reload">↻</button>
<button class="tool" id="home" title="New tab" aria-label="New tab">⌂</button>
<div id="addressWrap"><span style="font-size:16px;color:#8c7966">◎</span><input id="address" placeholder="Search DuckDuckGo or enter a website" autocomplete="off" spellcheck="false"><button class="tool" id="star" title="Bookmark" aria-label="Bookmark">☆</button></div>
<button id="go">Go ↗</button>
<button class="tool" id="menu" title="Browser options" aria-label="Browser options">▤</button>
</header>
<div id="body">
<aside id="sidebar">
<button id="newTab"><span class="sideIcon">＋</span>New tab</button>
<div id="tabList"></div>
<div id="sideBottom">
<button class="sideAction" data-shortcut="https://duckduckgo.com/"><span class="sideIcon">✧</span>AI</button>
<button class="sideAction" data-shortcut="https://www.crazygames.com/"><span class="sideIcon">♙</span>Games</button>
<button class="sideAction" id="account"><span class="sideIcon">♙</span>Account</button>
<button class="sideAction" id="settings"><span class="sideIcon">⚙</span>Settings</button>
</div>
</aside>
<main id="content">
<section id="start">
<div id="startInner">
<button id="discord">▣ &nbsp; Join our Discord &nbsp; ↗</button>
<div id="hero">
<div id="wordmark"><span class="mark"></span><span>Aether</span></div>
<form id="searchForm"><span style="font-size:21px">⌕</span><input id="searchInput" placeholder="Search" autocomplete="off"><button id="searchSubmit" type="submit" aria-label="Search">↗</button></form>
<div id="shortcuts">
<button class="shortcut" data-url="https://www.crazygames.com/"><span class="bubble">♙</span><span>Games</span></button>
<button class="shortcut" data-url="https://duckduckgo.com/"><span class="bubble">✧</span><span>AI</span></button>
<button class="shortcut" data-url="https://www.youtube.com/"><span class="bubble" style="color:#e52b24">▶</span><span>YouTube</span></button>
<button class="shortcut" data-url="https://www.instagram.com/"><span class="bubble" style="color:#c73b8e">◎</span><span>Instagram</span></button>
<button class="shortcut" data-url="https://www.tiktok.com/"><span class="bubble">♪</span><span>TikTok</span></button>
<button class="shortcut" data-url="https://discord.com/"><span class="bubble" style="color:#6573e9">☻</span><span>Discord</span></button>
<button class="shortcut" data-url="https://open.spotify.com/"><span class="bubble" style="color:#22a65a">◉</span><span>Spotify</span></button>
<button class="shortcut" data-url="https://www.twitch.tv/"><span class="bubble" style="color:#8d55dc">▣</span><span>Twitch</span></button>
<button class="shortcut" data-url="https://www.roblox.com/"><span class="bubble">◎</span><span>Roblox / nowgg…</span></button>
<button class="shortcut" id="addShortcut"><span class="bubble">＋</span><span>Add shortcut</span></button>
</div>
</div>
<footer id="foot"><span id="online">Ready</span><button id="customize">♧ &nbsp; Customize</button></footer>
</div>
</section>
<div id="pageStatus"></div>
</main>
</div>
</div>
<script>
(()=> {
const $=id=>document.getElementById(id), tabs=[], tabList=$('tabList'), start=$('start'), address=$('address'), status=$('pageStatus');
let activeId=null, sequence=1;
function cleanQuery(value){return String(value||'').trim()}
function resolveInput(value){
 const q=cleanQuery(value);
 if(!q)return 'https://duckduckgo.com/';
 if(/^https?:\/\//i.test(q))return q;
 if(/^(localhost|127\.0\.0\.1)(:\d+)?(\/.*)?$/i.test(q))return 'http://'+q;
 if(/^[\w-]+(\.[\w-]+)+(\/[^\s]*)?$/i.test(q)&&!q.includes(' '))return 'https://'+q;
 return 'https://duckduckgo.com/?q='+encodeURIComponent(q);
}
function current(){return tabs.find(t=>t.id===activeId)}
function showStatus(message){status.textContent=message;status.classList.add('show')}
function updateNav(){
 const t=current(), v=t&&t.view;
 $('back').disabled=!(v&&v.canGoBack());$('forward').disabled=!(v&&v.canGoForward());
 $('reload').textContent=v&&v.isLoading&&v.isLoading()?'×':'↻';
}
function renderTabs(){
 tabList.replaceChildren();
 for(const t of tabs){
  const b=document.createElement('button');b.className='tab'+(t.id===activeId?' active':'');b.title=t.title;
  const icon=document.createElement('span');icon.className='tabIcon';icon.textContent=t.url?'◎':'🌐';
  const title=document.createElement('span');title.className='tabTitle';title.textContent=t.title;
  const close=document.createElement('span');close.className='tabClose';close.textContent='×';close.title='Close tab';
  b.append(icon,title,close);b.onclick=()=>switchTab(t.id);close.onclick=e=>{e.stopPropagation();closeTab(t.id)};tabList.append(b);
 }
}
function switchTab(id){
 activeId=id;const t=current();
 for(const item of tabs)item.view.classList.toggle('active',item.id===id);
 start.style.display=t&&t.url?'none':'block';address.value=t&&t.url?t.url:'';
 renderTabs();updateNav();if(t&&t.url)showStatus(t.url);else status.classList.remove('show');
}
function makeTab(url=''){
 const id=sequence++,view=document.createElement('webview');
 view.setAttribute('partition','persist:veil');view.setAttribute('allowpopups','false');
 view.addEventListener('did-start-loading',()=>{if(activeId===id)showStatus('Loading page…')});
 view.addEventListener('did-stop-loading',()=>{if(activeId===id){address.value=view.getURL()||'';showStatus(view.getURL()||'Ready');updateNav()}});
 view.addEventListener('page-title-updated',e=>{const t=tabs.find(x=>x.id===id);if(t){t.title=e.title||'Website';renderTabs()}});
 view.addEventListener('did-navigate',()=>{const t=tabs.find(x=>x.id===id);if(t){t.url=view.getURL();t.title=view.getTitle()||t.title}if(activeId===id){address.value=view.getURL();updateNav()}renderTabs()});
 view.addEventListener('did-navigate-in-page',()=>{if(activeId===id)address.value=view.getURL()});
 view.addEventListener('did-fail-load',e=>{if(activeId===id&&e.errorCode!==-3)showStatus('This page could not load. The website or network may be blocking it.')});
 $('content').append(view);const t={id,view,title:'New tab',url};tabs.push(t);switchTab(id);if(url)navigate(url);return t;
}
function navigate(value){
 const t=current();if(!t)return;const url=resolveInput(value);t.url=url;t.title='Loading…';start.style.display='none';address.value=url;renderTabs();showStatus('Loading page…');
 try{t.view.loadURL(url)}catch(e){showStatus('Could not open this address. Try a full website URL.')}
}
function closeTab(id){
 const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const wasActive=activeId===id;tabs[i].view.remove();tabs.splice(i,1);
 if(!tabs.length){makeTab();return}if(wasActive)switchTab(tabs[Math.max(0,i-1)].id);else renderTabs();
}
$('go').onclick=()=>navigate(address.value);
address.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();navigate(address.value)}});
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=cleanQuery($('searchInput').value);if(q)navigate(q)});
$('newTab').onclick=()=>makeTab();$('home').onclick=()=>makeTab();$('back').onclick=()=>{const v=current()?.view;if(v?.canGoBack())v.goBack()};$('forward').onclick=()=>{const v=current()?.view;if(v?.canGoForward())v.goForward()};
$('reload').onclick=()=>{const v=current()?.view;if(!v)return;if(v.isLoading())v.stop();else if(v.getURL())v.reload();else switchTab(activeId)};
$('star').onclick=()=>{const t=current();if(t&&t.url){showStatus('Bookmark: '+t.url);$('star').textContent='★'}};
$('menu').onclick=()=>alert('Veil Browser\nDefault search engine: DuckDuckGo\nUse the address bar to search or enter a website URL.');
$('account').onclick=()=>showStatus('Account features are not configured yet.');
$('settings').onclick=()=>{const choice=prompt('Settings\nType "search" to open DuckDuckGo settings, or "home" to return to the new tab:','search');if(choice==='search')navigate('https://duckduckgo.com/settings');else if(choice==='home')makeTab()};
$('discord').onclick=()=>navigate('https://discord.com/');
$('customize').onclick=()=>{const color=prompt('New-tab background color (hex, e.g. #e8c7a0):','#e6c69f');if(color&&/^#[0-9a-f]{6}$/i.test(color))start.style.background='radial-gradient(ellipse at 49% 42%, #f5e2c7 0%, '+color+' 58%, #d8b58f 100%)'};
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.url)));
document.querySelectorAll('[data-shortcut]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.shortcut)));
$('addShortcut').onclick=()=>{const url=prompt('Enter a website URL to open:');if(url)navigate(url)};
makeTab();
})();
</script>
</body></html>
