<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e5c49d">
<meta name="description" content="Veil — a simple browser-style web search page.">
<title>Veil — Search the web</title>
<style>
:root{--sand:#e5c49d;--sand2:#efd9bb;--ink:#241d18;--mute:#6b5a4a;--paper:#fbf6ee;--teal:#1f5c5c;--line:#cfae83}
@media(prefers-color-scheme:dark){:root{--sand:#3a2f26;--sand2:#2d241c;--ink:#f1e6d6;--mute:#b9a58f;--paper:#1b1612;--teal:#6fc2bd;--line:#52422f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 Georgia,"Iowan Old Style",serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;border-radius:8px}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#tabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--sand);overflow-x:auto}.tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:200px;padding:6px 8px 6px 12px;border-radius:10px 10px 0 0;background:var(--sand2);cursor:pointer;white-space:nowrap}.tab.on{background:var(--paper)}.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}.tab button{width:20px;height:20px;line-height:1;color:var(--mute)}#newtab{width:30px;font-size:20px}
#bar{display:flex;gap:6px;padding:8px;background:var(--paper);border-bottom:1px solid var(--line)}#bar button{width:34px;height:34px;font-size:18px}#bar button:disabled{opacity:.35;cursor:default}#addr{flex:1;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sand2)}
#main{flex:1;min-height:0;position:relative;overflow:auto}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}#warn{position:absolute;left:0;right:0;top:0;z-index:2;padding:6px 12px;background:var(--sand);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#warn a{color:var(--teal)}
.home{max-width:620px;margin:0 auto;padding:12vh 20px 40px;text-align:center}.home h1{font-size:64px;margin:0 0 6px;letter-spacing:-.03em;font-weight:400}.home p{margin:0 0 24px;color:var(--mute)}.sbox{display:flex;gap:8px}.sbox input{flex:1;min-width:0;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--sand2)}.sbox button{padding:0 22px;background:var(--teal);color:var(--paper);border-radius:999px}.sc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}.sc button{padding:8px 16px;background:var(--sand2);border:1px solid var(--line);border-radius:999px}
.res{max-width:760px;margin:0 auto;padding:20px}.res h2{font-size:14px;font-weight:400;color:var(--mute);margin:0 0 14px}.ans{padding:12px 16px;margin-bottom:18px;background:var(--sand2);border-left:4px solid var(--teal);border-radius:6px}.ans p{margin:4px 0 0}.r{margin-bottom:20px}.r a{font-size:18px;color:var(--teal);text-decoration:none;overflow-wrap:anywhere}.r a:hover{text-decoration:underline}.r .u{font-size:12px;color:var(--mute);overflow-wrap:anywhere}.r p{margin:2px 0 0}.msg{padding:30px;text-align:center;color:var(--mute)}.msg a{color:var(--teal);font-weight:bold}.status{margin-top:12px;font-size:13px;color:var(--mute)}
@media(max-width:520px){#bar{gap:2px;padding:6px}#bar button{width:29px}.home{padding-top:10vh}.home h1{font-size:54px}.sbox{flex-wrap:wrap}.sbox input{width:100%;flex-basis:100%}.sbox button{padding:10px 22px;margin:auto}}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
<button id="back" title="Back" aria-label="Back">‹</button><button id="fwd" title="Forward" aria-label="Forward">›</button><button id="reload" title="Reload" aria-label="Reload">↻</button><button id="home" title="Home" aria-label="Home">⌂</button>
<input id="addr" placeholder="Search or type a web address" aria-label="Search or address" autocomplete="off">
</div>
<div id="main"></div>
<script>
const API='https://vyfeqjtoommsqsqbatyf.supabase.co/functions/v1/veil-search';
const SHORT=[['Wikipedia','https://en.wikipedia.org/'],['Hacker News','https://news.ycombinator.com/'],['Internet Archive','https://archive.org/'],['Open Library','https://openlibrary.org/'],['Marginalia','https://search.marginalia.nu/'],['Games','https://www.crazygames.com/'],['YouTube','https://www.youtube.com/']];
let tabs=[],cur=null,uid=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const searchUrl=q=>'https://duckduckgo.com/?q='+encodeURIComponent(String(q||'').trim());
function newTab(){const t={id:++uid,h:[{t:'home'}],i:0};tabs.push(t);cur=t.id;draw()}
function tab(){return tabs.find(t=>t.id===cur)}
function entry(t){return t.h[t.i]}
function go(e){const t=tab();t.h=t.h.slice(0,t.i+1);t.h.push(e);t.i++;if(e.t==='search')load(e);draw()}
function title(e){return e.t==='home'?'New tab':e.t==='search'?e.q:e.u.replace(/^https?:\/\//,'').split('/')[0]}
async function load(e){
 if(e.data||e.loading)return;e.loading=true;draw();
 try{
  const r=await fetch(API+'?engine=duckduckgo&q='+encodeURIComponent(e.q),{headers:{Accept:'application/json'},signal:AbortSignal.timeout(9000)});
  const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('Search service returned HTTP '+r.status));e.data=d;
 }catch(x){e.data={error:x&&x.message?x.message:'Could not reach the search service.'};}
 e.loading=false;if(entry(tab())===e)draw();
}
function submit(v){
 v=String(v||'').trim();if(!v)return;
 if(/^https?:\/\//i.test(v))go({t:'page',u:v});
 else if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v))go({t:'page',u:'https://'+v});
 else go({t:'search',q:v});
}
function draw(){
 const t=tab(),e=entry(t);
 $('tabs').innerHTML=tabs.map(x=>'<div class="tab'+(x.id===cur?' on':'')+'" data-id="'+x.id+'"><span>'+esc(title(entry(x)))+'</span><button data-x="'+x.id+'" aria-label="Close tab">×</button></div>').join('')+'<button id="newtab" aria-label="New tab">+</button>';
 $('back').disabled=t.i===0;$('fwd').disabled=t.i>=t.h.length-1;$('addr').value=e.t==='home'?'':e.t==='search'?e.q:e.u;
 const m=$('main');
 if(e.t==='home'){
  m.innerHTML='<div class="home"><h1>Veil</h1><p>Search the web without leaving this page.</p><form class="sbox" id="hf"><input id="hq" placeholder="Search DuckDuckGo" aria-label="Search" autocomplete="off" required><button>Search</button></form><div class="sc">'+SHORT.map(s=>'<button data-u="'+esc(s[1])+'">'+esc(s[0])+'</button>').join('')+'</div><div class="status">DuckDuckGo search · direct results fallback enabled</div></div>';
 }else if(e.t==='search'){
  if(!e.data){m.innerHTML='<div class="msg">Searching DuckDuckGo…</div>';return}
  const d=e.data;
  if(d.error){m.innerHTML='<div class="msg"><p>Veil could not fetch search results inside this page.</p><p>'+esc(d.error)+'</p><p><a href="'+esc(searchUrl(e.q))+'" target="_blank" rel="noopener noreferrer">Open these results directly on DuckDuckGo ↗</a></p><p><button data-retry="1">Try again</button></p></div>';return}
  const a=d.answer?'<div class="ans"><b>'+esc(d.answer.title)+'</b><p>'+esc(d.answer.text)+'</p></div>':'';
  const rs=(d.results||[]).map(r=>{let url;try{url=new URL(r.url);if(!['http:','https:'].includes(url.protocol))return ''}catch{return ''}return '<div class="r"><a href="'+esc(url.href)+'" data-go="'+esc(url.href)+'">'+esc(r.title||url.hostname)+'</a><div class="u">'+esc(url.hostname)+'</div><p>'+esc(r.content||r.snippet||r.description||'')+'</p></div>'}).join('');
  m.innerHTML='<div class="res"><h2>Results for “'+esc(e.q)+'” · DuckDuckGo</h2>'+a+(rs||'<div class="msg">No parsed results were returned. <p><a href="'+esc(searchUrl(e.q))+'" target="_blank" rel="noopener noreferrer">Open DuckDuckGo results ↗</a></p></div>')+'</div>';m.scrollTop=0;
 }else{
  m.innerHTML='<div id="warn">If this page is blank, the website may block embedding. <a href="'+esc(e.u)+'" target="_blank" rel="noopener noreferrer">Open this site in a new tab ↗</a></div><iframe src="'+esc(e.u)+'" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; autoplay; gamepad" title="Page"></iframe>';
 }
}
document.addEventListener('click',ev=>{
 const g=ev.target.closest('[data-go]');if(g){ev.preventDefault();go({t:'page',u:g.dataset.go});return}
 const s=ev.target.closest('[data-u]');if(s){go({t:'page',u:s.dataset.u});return}
 if(ev.target.closest('[data-retry]')){const e=entry(tab());if(e.t==='search'){e.data=null;e.loading=false;load(e)}return}
 const x=ev.target.closest('[data-x]');if(x){ev.stopPropagation();const id=+x.dataset.x;tabs=tabs.filter(q=>q.id!==id);if(!tabs.length)return newTab();if(cur===id)cur=tabs[tabs.length-1].id;draw();return}
 const tb=ev.target.closest('.tab');if(tb){cur=+tb.dataset.id;draw();return}
 if(ev.target.closest('#newtab'))newTab();
});
document.addEventListener('submit',ev=>{if(ev.target.id==='hf'){ev.preventDefault();submit($('hq').value)}});
$('addr').addEventListener('keydown',ev=>{if(ev.key==='Enter')submit($('addr').value)});
$('addr').addEventListener('focus',ev=>ev.target.select());
$('back').onclick=()=>{const t=tab();if(t.i>0){t.i--;draw()}};
$('fwd').onclick=()=>{const t=tab();if(t.i<t.h.length-1){t.i++;draw();const e=entry(t);if(e.t==='search'&&!e.data)load(e)}};
$('home').onclick=()=>go({t:'home'});
$('reload').onclick=()=>{const e=entry(tab());if(e.t==='search'){e.data=null;e.loading=false;load(e)}else if(e.t==='page'){const frame=$('main').querySelector('iframe');if(frame)frame.src=e.u}else draw()};
newTab();
</script>
</body>
</html>
