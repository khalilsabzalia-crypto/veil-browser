<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e5c49d">
<title>Veil — Search the web</title>
<style>
:root{--sand:#e5c49d;--sand2:#efd9bb;--ink:#241d18;--mute:#6b5a4a;--paper:#fbf6ee;--teal:#1f5c5c;--line:#cfae83}
@media (prefers-color-scheme:dark){:root{--sand:#3a2f26;--sand2:#2d241c;--ink:#f1e6d6;--mute:#b9a58f;--paper:#1b1612;--teal:#6fc2bd;--line:#52422f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 Georgia,"Iowan Old Style",serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;border-radius:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#tabs{display:flex;gap:4px;padding:6px 8px 0;background:var(--sand);overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;min-width:120px;max-width:200px;padding:6px 8px 6px 12px;border-radius:10px 10px 0 0;background:var(--sand2);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--paper)}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab button{width:20px;height:20px;line-height:1;color:var(--mute)}
#newtab{width:30px;font-size:20px}
#bar{display:flex;gap:6px;padding:8px;background:var(--paper);border-bottom:1px solid var(--line)}
#bar button{width:34px;height:34px;font-size:18px}
#bar button:disabled{opacity:.35;cursor:default}
#addr{flex:1;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--sand2)}
#main{flex:1;min-height:0;position:relative;overflow:auto}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#warn{position:absolute;left:0;right:0;top:0;z-index:2;padding:6px 12px;background:var(--sand);font-size:13px;display:flex;gap:10px;align-items:center}
#warn a{color:var(--teal)}
.home{max-width:620px;margin:0 auto;padding:12vh 20px 40px;text-align:center}
.home h1{font-size:64px;margin:0 0 6px;letter-spacing:-.03em;font-weight:400}
.home p{margin:0 0 24px;color:var(--mute)}
.sbox{display:flex;gap:8px}
.sbox input{flex:1;padding:12px 18px;border:1px solid var(--line);border-radius:999px;background:var(--sand2)}
.sbox button{padding:0 22px;background:var(--teal);color:var(--paper);border-radius:999px}
.sc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.sc button{padding:8px 16px;background:var(--sand2);border:1px solid var(--line);border-radius:999px}
.res{max-width:680px;margin:0 auto;padding:20px}
.res h2{font-size:14px;font-weight:400;color:var(--mute);margin:0 0 14px}
.ans{padding:12px 16px;margin-bottom:18px;background:var(--sand2);border-left:4px solid var(--teal);border-radius:6px}
.ans p{margin:4px 0 0}
.r{margin-bottom:20px}
.r a{font-size:18px;color:var(--teal);text-decoration:none}
.r a:hover{text-decoration:underline}
.r .u{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r p{margin:2px 0 0}
.msg{padding:30px;text-align:center;color:var(--mute)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;border:1px solid var(--line);color:var(--mute)}
.badge.ok{background:var(--teal);color:var(--paper);border-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
.chips button{padding:6px 14px;background:var(--sand2);border:1px solid var(--line);border-radius:999px}
.blocked{max-width:520px;margin:12vh auto;padding:24px;text-align:center}
.blocked h2{font-weight:400;font-size:22px;margin:0 0 8px}
.blocked p{color:var(--mute);margin:0}
.blocked a{display:inline-block;margin-top:18px;padding:10px 22px;background:var(--teal);color:var(--paper);border-radius:999px;text-decoration:none}
.sf label{display:block;margin-bottom:18px}
.sf input,.sf select{display:block;width:100%;margin-top:6px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sand2)}
.sf small{display:block;margin-top:6px;color:var(--mute)}
.sf button,.blocked button{padding:10px 24px;background:var(--teal);color:var(--paper);border-radius:999px}
.blocked button{margin:18px 0 0 8px}
.tog{margin:0 0 14px;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="bar">
  <button id="back" title="Back" aria-label="Back">‹</button>
  <button id="fwd" title="Forward" aria-label="Forward">›</button>
  <button id="reload" title="Reload" aria-label="Reload">↻</button>
  <button id="home" title="Home" aria-label="Home">⌂</button>
  <button id="gear" title="Settings" aria-label="Settings">⚙</button>
  <input id="addr" placeholder="Search or type a web address" aria-label="Search or address" autocomplete="off">
</div>
<div id="main"></div>
<script>
const API='https://chqzuwemjyclpkhbyooe.supabase.co/functions/v1/ddg-search';
const PROXY='https://chqzuwemjyclpkhbyooe.supabase.co/functions/v1/veil-proxy';
const SHORT=[['Games','#games'],['Wikipedia','https://en.wikipedia.org/'],['Hacker News','https://news.ycombinator.com/'],['Internet Archive','https://archive.org/'],['Open Library','https://openlibrary.org/'],['Marginalia','https://search.marginalia.nu/']];
const ENG={ddg:['DuckDuckGo (results inside Veil)',null],firefox:['Firefox (Google, Firefox’s default search)','https://www.google.com/search?client=firefox-b-d&q=%s'],google:['Google','https://www.google.com/search?q=%s'],bing:['Bing','https://www.bing.com/search?q=%s'],brave:['Brave Search','https://search.brave.com/search?q=%s'],wiki:['Wikipedia','https://en.wikipedia.org/w/index.php?search=%s']};
let S={engine:'ddg',noProxy:'.com, .org, .net'};
try{Object.assign(S,JSON.parse(localStorage.getItem('veil')||'{}'))}catch(x){}
function saveS(){try{localStorage.setItem('veil',JSON.stringify(S))}catch(x){}}
function noProxy(u){
  try{
    const h=new URL(u).hostname.toLowerCase();
    return S.noProxy.split(/[,\s]+/).map(x=>x.trim().toLowerCase().replace(/^\*/,'')).filter(Boolean)
      .some(r=>r.startsWith('.')?h.endsWith(r):(h===r||h.endsWith('.'+r)));
  }catch(x){return false}
}
let tabs=[],cur=null,uid=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function newTab(){const t={id:++uid,h:[{t:'home'}],i:0};tabs.push(t);cur=t.id;draw()}
function tab(){return tabs.find(t=>t.id===cur)}
function entry(t){return t.h[t.i]}
function go(e){if(e.t==='page')e.noproxy=noProxy(e.u);const t=tab();t.h=t.h.slice(0,t.i+1);t.h.push(e);t.i++;if(e.t==='search')load(e);draw()}
function title(e){return e.t==='home'?'New tab':e.t==='settings'?'Settings':e.t==='games'?'Games':e.t==='search'?(e.g?'Games: ':'')+e.q:e.u.replace(/^https?:\/\//,'').split('/')[0]}

async function load(e){
  if(e.data||e.loading)return;
  e.loading=true;
  try{
    const r=await fetch(API+'?q='+encodeURIComponent(e.g?e.q+' free online game play':e.q));
    e.data=await r.json();
  }catch(x){e.data={error:'Could not reach the search service. Check your connection and try again.'}}
  e.loading=false;draw();
}

const BASE=location.pathname.replace(/[^/]*$/,'');
const WISP='wss://wisp.freewisp.org/'; // shared public Wisp server; change this line to use your own
let uvBoot=null;
function addScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)})}
function bootUV(){
  if(uvBoot)return uvBoot;
  uvBoot=(async()=>{
    if(!('serviceWorker' in navigator))throw new Error('no service worker');
    await addScript(BASE+'uv/uv.bundle.js');await addScript(BASE+'uv/uv.config.js');
    let BM;
    try{BM=(await import(BASE+'baremux/index.mjs')).BareMuxConnection}
    catch(x){await addScript(BASE+'baremux/index.js');BM=self.BareMux.BareMuxConnection}
    const c=new BM(BASE+'baremux/worker.js');
    await c.setTransport(BASE+'epoxy/index.mjs',[{wisp:WISP}]);
    const reg=await navigator.serviceWorker.register(BASE+'sw.js',{scope:BASE+'service/'});
    if(!reg.active){
      const w=reg.installing||reg.waiting;
      await new Promise(r=>{if(!w)return r();if(w.state==='activated')return r();w.addEventListener('statechange',()=>{if(w.state==='activated')r()})});
    }
  })();
  uvBoot.catch(()=>{uvBoot=null});
  return uvBoot;
}
async function openUV(e){
  if(e.loading)return;e.loading=true;
  try{await bootUV();e.uv=__uv$config.prefix+__uv$config.encodeUrl(e.u)}catch(x){console.warn(x);e.uv=null}
  e.loading=false;draw();
}
async function loadProxy(e){
  if(e.loading)return;e.loading=true;
  try{
    const r=await fetch(PROXY+'?url='+encodeURIComponent(e.u));
    const d=await r.json();
    e.px=d.html?{html:d.html}:null;
    if(!d.html)e.why=d.nonhtml?'This link is a file, not a web page.':'The proxy could not fetch this page.';
  }catch(x){e.px=null;e.why='The proxy could not be reached.'}
  e.loading=false;draw();
}
async function checkPage(e){
  if(e.checking)return;e.checking=true;
  try{const r=await fetch(API+'?check='+encodeURIComponent(e.u));const d=await r.json();e.ok=d.embeddable!==false}
  catch(x){e.ok=true}
  e.checking=false;draw();
}
function submit(v){
  v=v.trim();if(!v)return;
  if(/^https?:\/\//i.test(v))go({t:'page',u:v});
  else if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v))go({t:'page',u:'https://'+v});
  else if(S.engine!=='ddg'&&ENG[S.engine])go({t:'page',u:ENG[S.engine][1].replace('%s',encodeURIComponent(v))});
  else go({t:'search',q:v});
}

function draw(){
  const t=tab(),e=entry(t);
  $('tabs').innerHTML=tabs.map(x=>`<div class="tab${x.id===cur?' on':''}" data-id="${x.id}"><span>${esc(title(entry(x)))}</span><button data-x="${x.id}" aria-label="Close tab">×</button></div>`).join('')+'<button id="newtab" aria-label="New tab">+</button>';
  $('back').disabled=t.i===0;$('fwd').disabled=t.i>=t.h.length-1;
  $('addr').value=e.t==='search'?e.q:e.t==='page'?e.u:'';
  const m=$('main');
  if(e.t==='home'){
    m.innerHTML=`<div class="home"><h1>Veil</h1><p>Search the web without leaving this page.</p><form class="sbox" id="hf"><input id="hq" placeholder="Search DuckDuckGo" aria-label="Search" autofocus><button>Search</button></form><div class="sc">${SHORT.map(s=>`<button data-u="${s[1]}">${s[0]}</button>`).join('')}</div></div>`;
  }else if(e.t==='settings'){
    m.innerHTML=`<div class="res sf"><h2>Settings</h2><form id="sf"><label>Search engine<select id="se">${Object.keys(ENG).map(k=>`<option value="${k}"${S.engine===k?' selected':''}>${esc(ENG[k][0])}</option>`).join('')}</select><small>Anything other than DuckDuckGo opens that engine’s own results page. “Firefox” uses the same search Firefox has by default. These results pages are .com addresses, so they follow the “No proxy for” list below.</small></label><label>No proxy for<input id="np" value="${esc(S.noProxy)}" placeholder=".com, .org, .net" autocomplete="off"><small>Comma-separated, like Firefox. A leading dot (.com) matches every site ending that way; a name (example.org) matches that site and its subdomains. Matching sites load directly and skip Veil’s proxy. Clear the box to proxy everything.</small></label><button>Save</button>${e.saved?' <span class="badge ok">Saved</span>':''}</form></div>`;
  }else if(e.t==='games'){
    const G=['io games','shooter','puzzle','racing','multiplayer','Shell Shockers','platformer','strategy'];
    m.innerHTML=`<div class="home"><h1>Games</h1><p>Search any game. Results marked “Plays here” open inside Veil.</p><form class="sbox" id="gf"><input id="gq" placeholder="Search games" aria-label="Search games" autofocus><button>Search</button></form><div class="chips">${G.map(x=>`<button data-gq="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;
  }else if(e.t==='search'){
    if(!e.data){m.innerHTML='<div class="msg">Searching…</div>';return}
    const d=e.data;
    if(d.error){m.innerHTML=`<div class="msg">${esc(d.error)}</div>`;return}
    const a=d.answer?`<div class="ans"><b>${esc(d.answer.title)}</b><p>${esc(d.answer.text)}</p></div>`:'';
    const list=(d.results||[]).filter(r=>!e.only||r.embeddable===true);
    const bd=r=>r.embeddable===true?'<span class="badge ok">Plays here</span>':r.embeddable===false?'<span class="badge">Via Veil proxy</span>':'';
    const rs=list.map(r=>`<div class="r"><a href="${esc(r.url)}" data-go="${esc(r.url)}" data-ok="${r.embeddable===false?0:1}">${esc(r.title)}</a>${bd(r)}<div class="u">${esc(r.url)}</div><p>${esc(r.snippet)}</p></div>`).join('');
    const tg=`<label class="tog"><input type="checkbox" id="only"${e.only?' checked':''}> Only show sites that play inside Veil</label>`;
    m.innerHTML=`<div class="res"><h2>${e.g?'Games':'Results'} for “${esc(e.q)}”</h2>${tg}${a}${rs||'<div class="msg">Nothing here. Try different words'+(e.only?' or turn off the filter.':'.')+'</div>'}</div>`;
    m.scrollTop=0;
  }else if(e.ok===undefined){
    m.innerHTML='<div class="msg">Checking whether this site can open here…</div>';checkPage(e);
  }else if(e.ok===false&&e.noproxy){
    m.innerHTML=`<div class="blocked"><h2>This site won’t open here</h2><p>${esc(title(e))} forbids being shown in a frame, and the proxy is off for this kind of address (see Settings, “No proxy for”).</p><a href="${esc(e.u)}" target="_blank" rel="noopener">Open in a new tab</a><button data-px="1">Load through the proxy anyway</button></div>`;
  }else if(e.ok===false&&e.uv===undefined){
    m.innerHTML='<div class="msg">Opening through Veil’s proxy…</div>';openUV(e);
  }else if(e.ok===false&&e.uv){
    m.innerHTML=`<div id="warn">Loaded through Veil’s proxy. <a href="${esc(e.u)}" target="_blank" rel="noopener">Open it in a new tab</a></div><iframe src="${esc(e.uv)}" allow="fullscreen; autoplay; gamepad; clipboard-write" title="Page"></iframe>`;
  }else if(e.ok===false&&e.px===undefined){
    m.innerHTML='<div class="msg">This site blocks frames. Loading it through Veil…</div>';loadProxy(e);
  }else if(e.ok===false&&e.px===null){
    m.innerHTML=`<div class="blocked"><h2>Veil couldn’t load this site</h2><p>${esc(e.why||'The page did not load.')} You can still open it in its own tab.</p><a href="${esc(e.u)}" target="_blank" rel="noopener">Open ${esc(title(e))} in a new tab</a></div>`;
  }else if(e.ok===false){
    m.innerHTML=`<div id="warn">Loaded through Veil’s proxy. Logins and live features may not work. <a href="${esc(e.u)}" target="_blank" rel="noopener">Open it in a new tab</a></div><iframe sandbox="allow-scripts allow-forms allow-popups allow-pointer-lock allow-modals allow-downloads" allow="fullscreen; autoplay; gamepad" title="Page"></iframe>`;
    m.querySelector('iframe').srcdoc=e.px.html;
  }else{
    m.innerHTML=`<div id="warn">Blank page? This site may refuse to load inside Veil. <a href="${esc(e.u)}" target="_blank" rel="noopener">Open it in a new window</a></div><iframe src="${esc(e.u)}" referrerpolicy="no-referrer" allow="fullscreen; autoplay; gamepad" title="Page"></iframe>`;
  }
}

document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');
  if(g){ev.preventDefault();go({t:'page',u:g.dataset.go,ok:g.dataset.ok==='0'?false:true});return}
  if(ev.target.closest('[data-px]')){const e=entry(tab());e.noproxy=false;draw();return}
  const gq=ev.target.closest('[data-gq]');if(gq){go({t:'search',q:gq.dataset.gq,g:true});return}
  const s=ev.target.closest('[data-u]');if(s){s.dataset.u==='#games'?go({t:'games'}):go({t:'page',u:s.dataset.u});return}
  const x=ev.target.closest('[data-x]');
  if(x){ev.stopPropagation();const id=+x.dataset.x;tabs=tabs.filter(q=>q.id!==id);if(!tabs.length)return newTab();if(cur===id)cur=tabs[tabs.length-1].id;draw();return}
  const tb=ev.target.closest('.tab');if(tb){cur=+tb.dataset.id;draw();return}
  if(ev.target.closest('#newtab'))newTab();
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='hf'){ev.preventDefault();submit($('hq').value)}
  if(ev.target.id==='sf'){ev.preventDefault();S.engine=$('se').value;S.noProxy=$('np').value;saveS();const e=entry(tab());e.saved=true;draw()}
  if(ev.target.id==='gf'){ev.preventDefault();const v=$('gq').value.trim();if(v)go({t:'search',q:v,g:true})}
});
document.addEventListener('change',ev=>{if(ev.target.id==='only'){entry(tab()).only=ev.target.checked;draw()}});
window.addEventListener('message',ev=>{
  const d=ev.data,f=document.querySelector('iframe');
  if(d&&d.veil==='nav'&&typeof d.url==='string'&&/^https?:/.test(d.url)&&f&&ev.source===f.contentWindow)go({t:'page',u:d.url,ok:false});
});
$('addr').addEventListener('keydown',ev=>{if(ev.key==='Enter')submit($('addr').value)});
$('addr').addEventListener('focus',ev=>ev.target.select());
$('back').onclick=()=>{const t=tab();if(t.i>0){t.i--;draw()}};
$('fwd').onclick=()=>{const t=tab();if(t.i<t.h.length-1){t.i++;draw()}};
$('home').onclick=()=>go({t:'home'});
$('gear').onclick=()=>go({t:'settings'});
$('reload').onclick=()=>{const e=entry(tab());if(e.t==='search'){e.data=null;load(e)}draw()};
newTab();
</script>
</body>
</html>
