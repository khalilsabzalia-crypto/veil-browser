<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e5c49d">
<meta name="description" content="Veil — DuckDuckGo search and web shortcuts.">
<title>Veil — Search the web</title>
<style>
:root{color-scheme:light;--ink:#39291d;--muted:#806e5e;--line:#e7d7c7;--panel:#fffdfb;--side:#f8f2ec;--accent:#bf783f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100vh;background:#f5eee5}button,input{font:inherit}button{cursor:pointer;color:inherit}
#app{min-height:100vh;display:flex;flex-direction:column}
#topbar{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#faf6f1;border-bottom:1px solid var(--line)}
#brand{width:91px;flex:none;display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}.mark{display:inline-block;width:19px;height:11px;border:3px solid white;border-radius:50%;background:#e2bd94;box-shadow:0 0 0 1px #e2bd94}
.tool{height:32px;width:32px;border:0;border-radius:8px;background:transparent;color:#826f5d;font-size:18px;display:grid;place-items:center}.tool:hover{background:#eee2d6}
#addressForm{height:35px;display:flex;align-items:center;gap:9px;flex:1;min-width:0;padding:0 12px;background:#fffdfa;border:1px solid #e2d2c3;border-radius:11px}#address{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}#address::placeholder{color:#8a7765}
#go{height:34px;padding:0 15px;border:1px solid var(--accent);border-radius:10px;background:#fffdfa;font-weight:700}#go:hover{background:#fff3e8}
#layout{display:flex;flex:1;min-height:calc(100vh - 54px)}
#sidebar{width:221px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 7px 8px}
.sidebtn{height:39px;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;border-radius:9px;background:transparent;text-align:left;color:#4c392a}.sidebtn:hover,.sidebtn.active{background:#ebdfd3}.sideicon{width:17px;text-align:center;font-size:17px}.side-label{padding:13px 11px 6px;color:#a18b77;font-size:10px;text-transform:uppercase;letter-spacing:1.3px}
#tabs{display:flex;flex-direction:column;gap:4px;padding:0 1px}.tab{height:42px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#685441;text-align:left;min-width:0}.tab.active{background:#e8dace;border-color:#dfd0c1;box-shadow:0 2px 4px #65482c13}.tab span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;color:#907b67;font-size:16px;padding:0}
#sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:3px}
#main{position:relative;flex:1;min-width:0;min-height:calc(100vh - 54px);background:radial-gradient(ellipse at 49% 44%,#f3dfc2 0%,#e4c29b 51%,#d8b38a 100%);overflow:hidden}
#main:before{content:"";position:absolute;inset:-40px;pointer-events:none;background:radial-gradient(ellipse at 23% 24%,#fff4e1a8,transparent 35%),radial-gradient(ellipse at 77% 65%,#c99b6a55,transparent 36%);filter:blur(20px)}
#home{position:relative;z-index:1;min-height:calc(100vh - 54px);max-width:1100px;margin:auto;padding:27px 25px 24px;display:flex;flex-direction:column;align-items:center}
#topAction{align-self:flex-end;border:1px solid #ead7c3;border-radius:16px;background:#fffaf5;padding:12px 16px;font-weight:700;box-shadow:0 5px 20px #65401d12}
#hero{width:100%;margin:auto 0;text-align:center;padding:32px 0 52px}
#wordmark{display:flex;justify-content:center;align-items:center;gap:24px;font-size:clamp(58px,7.5vw,90px);font-weight:550;letter-spacing:-5px;line-height:1;margin-bottom:48px;color:#382719}#wordmark .mark{width:61px;height:30px;border:9px solid white;background:transparent;box-shadow:none}
#searchForm{height:56px;width:min(100%,660px);margin:auto;display:flex;align-items:center;gap:12px;padding:0 18px;background:#fffdfb;border:1px solid #f0dfcf;border-radius:40px;box-shadow:0 7px 24px #6e4c2a18}#searchInput{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#493628;font-size:14px}#searchInput::placeholder{color:#806c5a}#searchForm button{border:0;background:transparent;font-size:22px;padding:3px 6px}
#shortcuts{max-width:690px;display:flex;flex-wrap:wrap;justify-content:center;gap:27px 20px;margin:39px auto 0}
.shortcut{width:88px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0;border:0;background:transparent;font-size:12px;color:#4a3728}.bubble{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#fffdfb;box-shadow:0 5px 15px #5e3b1c1c;font-size:21px;transition:transform .15s}.shortcut:hover .bubble{transform:translateY(-3px)}
#footer{position:relative;z-index:1;width:100%;margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:#674b32;font-size:12px}#ready{border:1px solid #ead8c5;border-radius:24px;background:#fffaf5;padding:10px 15px}#ready:before{content:"●";font-size:10px;color:#c9824a;margin-right:8px}#customize{border:1px solid #ead8c5;border-radius:13px;background:#fffaf5;padding:12px 16px;font-weight:650}
#resultsPage{display:none;position:relative;z-index:1;min-height:calc(100vh - 54px);height:calc(100vh - 54px);background:#fff;overflow:hidden}#resultsBar{position:sticky;top:0;background:#fff;padding:12px 22px 10px;border-bottom:1px solid #eee;z-index:2}#resultsSearch{display:flex;align-items:center;gap:10px;border:1px solid #ddd;border-radius:28px;height:44px;padding:0 15px;max-width:900px}#resultsQuery{flex:1;min-width:0;border:0;outline:0;background:transparent}#resultsSearch button{border:0;background:transparent;color:#8b5a33;font-size:19px}#resultsBody{max-width:820px;padding:22px 28px}#resultsLabel{color:#6e756e;font-size:12px;margin-bottom:17px}#resultsList{display:flex;flex-direction:column;gap:0}#engineLine{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}#engineSelect{border:1px solid #ddd;border-radius:8px;padding:7px 9px;background:#fff;color:#333}#openDdg{color:#1a0dab;font-size:12px}.result{padding:0 0 22px;margin-bottom:20px;border-bottom:1px solid #eee}.result .url{font-size:12px;color:#4e6b4b;margin-bottom:4px;overflow-wrap:anywhere}.result h2{margin:0 0 5px;font-size:20px;font-weight:500}.result h2 a{color:#1a0dab;text-decoration:none}.result h2 a:hover{text-decoration:underline}.result p{margin:0;color:#4b4b4b;line-height:1.55;font-size:14px}.result .external{display:inline-block;margin-top:7px;color:#555;font-size:12px}.resultsHint{color:#6c6c6c;font-size:13px;padding:15px 0}
@media(max-width:720px){#sidebar{width:58px;padding:9px 4px}#sidebar .sidebtn{justify-content:center;padding:0;font-size:0}#sidebar .sidebtn .sideicon{font-size:18px}#sidebar .side-label,#tabs{display:none}#topbar{gap:4px;padding:0 6px}#brand{width:26px;font-size:0;gap:0}#wordmark{font-size:58px;gap:15px;margin-bottom:32px}#wordmark .mark{width:43px;height:23px;border-width:7px}#home{padding:17px 12px}#shortcuts{gap:20px 7px;margin-top:28px}.shortcut{width:65px}#resultsBody{padding:18px 16px}#resultsBar{padding:10px}}
</style>
</head>
<body>
<div id="app">
<header id="topbar">
<div id="brand"><span class="mark"></span>Veil</div>
<button class="tool" id="back" title="Back to start" aria-label="Back">‹</button>
<button class="tool" id="forward" title="Forward" aria-label="Forward">›</button>
<button class="tool" id="reload" title="Reload" aria-label="Reload">↻</button>
<button class="tool" id="homeButton" title="New tab" aria-label="Home">⌂</button>
<form id="addressForm"><span style="color:#8b7865">◎</span><input id="address" placeholder="Search DuckDuckGo or enter a website address" autocomplete="off"><button class="tool" type="submit" aria-label="Go">↗</button></form>
<button id="go" form="addressForm">Go ↗</button>
</header>
<div id="layout">
<aside id="sidebar">
<button class="sidebtn active" id="newTab"><span class="sideicon">＋</span>New tab</button>
<div class="side-label">Tabs</div><div id="tabs"></div>
<div id="sidebottom">
<button class="sidebtn" data-url="https://duckduckgo.com/"><span class="sideicon">✧</span>AI / Search</button>
<button class="sidebtn" data-url="https://www.crazygames.com/"><span class="sideicon">♙</span>Games</button>
<button class="sidebtn" data-url="https://www.youtube.com/"><span class="sideicon">▶</span>YouTube</button>
<button class="sidebtn" id="settings"><span class="sideicon">⚙</span>Settings</button>
</div>
</aside>
<main id="main">
<section id="home">
<button id="topAction" data-url="https://discord.com/">▣ &nbsp; Join our Discord &nbsp; ↗</button>
<div id="hero">
<div id="wordmark"><span class="mark"></span><span>Veil</span></div>
<form id="searchForm"><span style="font-size:21px">⌕</span><input id="searchInput" placeholder="Search DuckDuckGo" autocomplete="off" required><button type="submit" aria-label="Search">↗</button></form>
<div id="shortcuts">
<button class="shortcut" data-url="https://www.crazygames.com/"><span class="bubble">♙</span><span>Games</span></button>
<button class="shortcut" data-url="https://duckduckgo.com/"><span class="bubble">✧</span><span>AI</span></button>
<button class="shortcut" data-url="https://www.youtube.com/"><span class="bubble" style="color:#e52b24">▶</span><span>YouTube</span></button>
<button class="shortcut" data-url="https://www.instagram.com/"><span class="bubble" style="color:#c13e8e">◎</span><span>Instagram</span></button>
<button class="shortcut" data-url="https://www.tiktok.com/"><span class="bubble">♪</span><span>TikTok</span></button>
<button class="shortcut" data-url="https://discord.com/"><span class="bubble" style="color:#6573e9">☻</span><span>Discord</span></button>
<button class="shortcut" data-url="https://open.spotify.com/"><span class="bubble" style="color:#22a65a">◉</span><span>Spotify</span></button>
<button class="shortcut" data-url="https://www.twitch.tv/"><span class="bubble" style="color:#8d55dc">▣</span><span>Twitch</span></button>
<button class="shortcut" data-url="https://www.roblox.com/"><span class="bubble">◇</span><span>Roblox / nowgg…</span></button>
<button class="shortcut" id="addShortcut"><span class="bubble">＋</span><span>Add shortcut</span></button>
</div>
</div>
<footer id="footer"><span id="ready">DuckDuckGo search ready</span><button id="customize">♧ &nbsp; Customize</button></footer>
</section>
<section id="resultsPage">
<div id="resultsBar"><form id="resultsSearch"><span>⌕</span><input id="resultsQuery" placeholder="Search DuckDuckGo" autocomplete="off"><button type="submit" aria-label="Search">↗</button></form></div>
<div id="resultsBody"><div id="resultsLabel">Search results</div><div id="engineLine"><label for="engineSelect">Search index:</label><select id="engineSelect"><option value="wikipedia">Wikipedia</option><option value="hackernews">Hacker News</option><option value="github">GitHub projects</option><option value="archive">Internet Archive</option><option value="books">Open Library</option><option value="marginalia">Marginalia</option></select><a id="openDdg" target="_blank" rel="noopener noreferrer">Open full DuckDuckGo results ↗</a></div><div id="resultsList"></div></div>
</section>
</main>
</div>
</div>
<script>
(()=> {
const $=id=>document.getElementById(id);
const tabs=[];let activeId=0,nextId=1,history=[];
function queryUrl(q){return 'https://duckduckgo.com/?q='+encodeURIComponent(String(q||'').trim())}
function resolve(v){v=String(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(/^[\w-]+(\.[\w-]+)+(\/[^\s]*)?$/i.test(v)&&!v.includes(' '))return 'https://'+v;return queryUrl(v)}
const API="https://vyfeqjtoommsqsqbatyf.supabase.co/functions/v1/veil-search";let selectedEngine="wikipedia";async function showResults(q){q=String(q||'').trim();if(!q)return;const url=queryUrl(q);history.push(url);$('home').style.display='none';$('resultsPage').style.display='block';$('resultsQuery').value=q;$('resultsLabel').textContent='Results for “'+q+'”';$('openDdg').href=url;$('address').value=q;$('ready').textContent='Searching…';const list=$('resultsList');list.replaceChildren();const loading=document.createElement('p');loading.className='resultsHint';loading.textContent='Searching '+$('engineSelect').selectedOptions[0].text+'…';list.append(loading);try{const response=await fetch(API+'?engine='+encodeURIComponent(selectedEngine)+'&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});const payload=await response.json();if(!response.ok||payload.error)throw new Error(payload.error||'Search request failed.');list.replaceChildren();const items=Array.isArray(payload.results)?payload.results:[];if(!items.length){const empty=document.createElement('p');empty.className='resultsHint';empty.textContent='No results found in this index. Try another index or open full DuckDuckGo results.';list.append(empty)}items.forEach(item=>{let safe;try{safe=new URL(item.url);if(!['http:','https:'].includes(safe.protocol))return}catch{return}const article=document.createElement('article');article.className='result';const domain=document.createElement('div');domain.className='url';domain.textContent=safe.hostname;const h=document.createElement('h2');const a=document.createElement('a');a.href=safe.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title||safe.hostname;h.append(a);const p=document.createElement('p');p.textContent=item.content||item.description||'';article.append(domain,h,p);list.append(article)});$('ready').textContent='Search complete · '+(payload.provider||'Veil search')}catch(err){list.replaceChildren();const p=document.createElement('p');p.className='resultsHint';p.textContent='This search index is temporarily unavailable. '+(err&&err.message?err.message:'Try another index.');list.append(p);$('ready').textContent='Search failed — try another index'}}
function goTo(value){const url=resolve(value);if(url)window.location.href=url}
function renderTabs(){const root=$('tabs');root.replaceChildren();tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t.id===activeId?' active':'');const icon=document.createElement('span');icon.textContent='◎';const name=document.createElement('span');name.textContent=t.title;const close=document.createElement('button');close.type='button';close.textContent='×';close.title='Close tab';b.append(icon,name,close);b.onclick=()=>{activeId=t.id;renderTabs();$('ready').textContent='Selected '+t.title};close.onclick=e=>{e.stopPropagation();const i=tabs.findIndex(x=>x.id===t.id);tabs.splice(i,1);if(!tabs.length)makeTab();else{activeId=tabs[Math.max(0,i-1)].id;renderTabs()}};root.append(b)})}
function makeTab(){const t={id:nextId++,title:'New tab'};tabs.push(t);activeId=t.id;renderTabs();$('home').style.display='flex';$('resultsPage').style.display='none';$('searchInput').focus();$('ready').textContent='DuckDuckGo search ready'}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();showResults($('searchInput').value)});
$('resultsSearch').addEventListener('submit',e=>{e.preventDefault();showResults($('resultsQuery').value)});$('engineSelect').addEventListener('change',e=>{selectedEngine=e.target.value;if($('resultsQuery').value.trim())showResults($('resultsQuery').value)});
$('addressForm').addEventListener('submit',e=>{e.preventDefault();const v=String($('address').value||'').trim();if(!v)return;if(/^https?:\/\//i.test(v)||/^[\w-]+(\.[\w-]+)+(\/[^\s]*)?$/i.test(v))goTo(v);else showResults(v)});
$('newTab').onclick=makeTab;$('homeButton').onclick=makeTab;$('back').onclick=()=>{if($('resultsPage').style.display==='block'){ $('resultsPage').style.display='none';$('home').style.display='flex';$('address').value='';$('ready').textContent='DuckDuckGo search ready';}else makeTab()};$('forward').onclick=()=>{if(history.length){showResults($('resultsQuery').value)}};$('reload').onclick=()=>{if($('resultsPage').style.display==='block')showResults($('resultsQuery').value);else window.location.reload()};
document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.url)));
$('addShortcut').onclick=()=>{const url=prompt('Enter a website address or domain:');if(url)goTo(url)};
$('settings').onclick=()=>{const color=prompt('Choose a new-tab background color (hex, e.g. #e6c69f):','#e6c69f');if(color&&/^#[0-9a-f]{6}$/i.test(color))$('main').style.background='radial-gradient(ellipse at 49% 44%,#f3dfc2 0%,'+color+' 51%,#d8b38a 100%)'};
$('address').addEventListener('focus',()=>{$('address').select()});
makeTab();
})();
</script>
</body>
</html>
